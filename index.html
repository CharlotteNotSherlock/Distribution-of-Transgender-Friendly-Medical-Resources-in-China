<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Distribution of Transgender-Friendly Medical Resources in China</title>
    <!-- 引入 Mapbox 的样式和 JS 库 -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #map {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        /* 左上角交互面板 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1;
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
            border-radius: 12px;
            color: #fff;
            width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 16px; color: #fff; }
        .control-panel p { margin: 0 0 16px 0; font-size: 12px; color: #aaa; line-height: 1.4; }

        .btn-stack { display: flex; flex-direction: column; gap: 8px; }

        .filter-btn {
            background: #2a2b30;
            color: #ccc;
            border: 1px solid #444;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { background: #3a3b40; color: #fff; }

        /* 激活状态的按钮高亮 */
        .filter-btn.active {
            background: #00f2ff;
            color: #000;
            font-weight: bold;
            border-color: #00f2ff;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.5);
        }

        /* 鼠标移到地图点上的 Popup 气泡框样式 */
        .mapboxgl-popup-content {
            background: #222;
            color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 13px;
        }
        .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #222; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="control-panel">
    <h3>Distribution of Transgender-Friendly Doctors in China</h3>
    <div class="btn-stack">
        <button id="btn-all" class="filter-btn active" onclick="updateFilter('all')">📍 All Doctors</button>
        <button id="btn-guide" class="filter-btn" onclick="updateFilter('guide')">🧭 HRT Guidance</button>
        <button id="btn-initial" class="filter-btn" onclick="updateFilter('initial')">🏥 Can Initiate HRT</button>
    </div>
</div>

<script>
    // 1. Token (injected by GitHub Actions at deploy time)
    const MAPBOX_TOKEN = '__MAPBOX_TOKEN__';
    const isUnsetToken = !MAPBOX_TOKEN
        || MAPBOX_TOKEN.startsWith('__')
        || MAPBOX_TOKEN.includes('MAPBOX_TOKEN');
    if (isUnsetToken) {
        throw new Error('Missing Mapbox token. Set MAPBOX_TOKEN in GitHub Actions secrets before deployment.');
    }
    mapboxgl.accessToken = MAPBOX_TOKEN;

    // 存储处理后的完整数据，供筛选时重建聚类
    let adjustedGeojson = null;

    // 2. 初始化地图
    const chinaBounds = [
        [73.5, 3.0],
        [134.8, 53.6]
    ];

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [104.0, 35.0],
        zoom: 3.2,
        minZoom: 2.5,
        projection: 'mercator',
        renderWorldCopies: false,
        maxBounds: chinaBounds,
        pitchWithRotate: false,
        dragRotate: false
    });

    // 3. 当地图加载完毕后，把数据放进去
    map.on('load', () => {
        map.fitBounds(chinaBounds, { padding: 40, duration: 0 });

        // 并行加载边界与医院数据，再按固定顺序添加图层，避免图层顺序受网络时序影响
        Promise.all([
            fetch('./china_boundary.geojson').then(r => r.json()),
            fetch('./hospitals_ready.geojson').then(r => r.json())
        ]).then(([boundary, geojson]) => {
            // ---- 1. 中国边界镂空遮罩（始终在最底层） ----
            const worldRing = [
                [-180, -85],
                [180, -85],
                [180, 85],
                [-180, 85],
                [-180, -85]
            ];

            // 中国边界可能是 MultiPolygon，每个多边形的外环都作为镂空孔
            const holes = [];
            const polys = boundary.geometry.type === 'MultiPolygon'
                ? boundary.geometry.coordinates
                : [boundary.geometry.coordinates];
            polys.forEach((polygon) => {
                if (polygon && polygon.length > 0) {
                    holes.push(polygon[0]);
                }
            });

            const outsideMask = {
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    properties: {},
                    geometry: {
                        type: 'Polygon',
                        coordinates: [worldRing, ...holes]
                    }
                }]
            };

            map.addSource('outside-mask', {
                type: 'geojson',
                data: outsideMask
            });

            map.addLayer({
                id: 'outside-mask',
                type: 'fill',
                source: 'outside-mask',
                paint: {
                    'fill-color': '#000000',
                    'fill-opacity': 1
                }
            });

            // 在中国边界上叠加一条淡淡的描边，进一步强调领土轮廓
            map.addSource('china-boundary', {
                type: 'geojson',
                data: boundary
            });
            map.addLayer({
                id: 'china-boundary-line',
                type: 'line',
                source: 'china-boundary',
                paint: {
                    'line-color': 'rgba(148, 226, 213, 0.55)',
                    'line-width': 1
                }
            });

            // ---- 2. 医院数据 ----
            const adjustedFeatures = geojson.features.map((feature) => ({
                ...feature,
                properties: { ...feature.properties }
            }));

            adjustedGeojson = {
                ...geojson,
                features: adjustedFeatures
            };

            map.addSource('hospitals-data', {
                type: 'geojson',
                data: adjustedGeojson,
                cluster: true,
                clusterRadius: 50,
                clusterMaxZoom: 16
            });

            // 密度热力图（弱化，仅作背景参考）
            map.addLayer({
                id: 'hospitals-heat',
                type: 'heatmap',
                source: 'hospitals-data',
                paint: {
                    'heatmap-radius': [
                        'interpolate', ['linear'], ['zoom'],
                        3, 15,
                        6, 30,
                        8, 45
                    ],
                    'heatmap-opacity': 0.5,
                    'heatmap-color': [
                        'interpolate', ['linear'], ['heatmap-density'],
                        0, 'rgba(0,0,0,0)',
                        0.3, 'rgba(0, 242, 255, 0.25)',
                        0.6, 'rgba(0, 255, 128, 0.4)',
                        1, 'rgba(255, 230, 0, 0.55)'
                    ]
                }
            });

            // 多医生位置：聚合圆（带数量）
            const clusterFilter = ['all', ['has', 'point_count'], ['>', ['get', 'point_count'], 1]];
            map.addLayer({
                id: 'hospitals-cluster',
                type: 'circle',
                source: 'hospitals-data',
                filter: clusterFilter,
                paint: {
                    'circle-color': '#00f2ff',
                    'circle-opacity': 0.85,
                    'circle-radius': [
                        'step', ['get', 'point_count'],
                        18, 2,
                        25, 5,
                        32, 9,
                        40
                    ],
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 1.5
                }
            });

            map.addLayer({
                id: 'hospitals-cluster-count',
                type: 'symbol',
                source: 'hospitals-data',
                filter: clusterFilter,
                layout: {
                    'text-field': ['get', 'point_count_abbreviated'],
                    'text-size': 13,
                    'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular']
                },
                paint: {
                    'text-color': '#111111'
                }
            });

            // 单个医生：独立彩色圆点（所有缩放级别都显示）
            map.addLayer({
                id: 'hospitals-point',
                type: 'circle',
                source: 'hospitals-data',
                filter: ['any', ['!', ['has', 'point_count']], ['==', ['get', 'point_count'], 1]],
                paint: {
                    'circle-radius': 5,
                    'circle-color': '#00f2ff',
                    'circle-stroke-color': '#111111',
                    'circle-stroke-width': 1
                }
            });

            const showPopup = (e) => {
                const feature = e.features && e.features[0];
                if (!feature) return;

                const props = feature.properties;
                const coordinates = feature.geometry.coordinates.slice();

                const canInitial = String(props.can_initial || '').trim().toLowerCase() === 'yes';
                const canGuide = String(props.can_guidance || '').trim().toLowerCase() === 'yes';
                const serviceType = canInitial && canGuide
                    ? 'Initiate HRT + Guidance'
                    : canInitial
                        ? 'Initiate HRT only'
                        : canGuide
                            ? 'Guidance only'
                            : 'No listed service';

                const popupContent = `
                    <strong style="font-size:14px; color:#00f2ff;">${props.hospital_name || props.hospital || 'Unknown hospital'}</strong><br>
                    ${props.hospital_name_chinese ? `<span style="color:#aaa;">${props.hospital_name_chinese}</span><br>` : ''}
                    <span style="color:#aaa;">City: ${props.city || 'Unknown'}</span><br>
                    ${props.department ? `<span>Department: <b>${props.department}</b></span><br>` : ''}
                    <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
                    <span>Initiate HRT: <b>${canInitial ? '✅ Supported' : '❌ Not Supported'}</b></span><br>
                    <span>Guidance: <b>${canGuide ? '✅ Supported' : '❌ Not Supported'}</b></span><br>
                    <span>Service Type: <b>${serviceType}</b></span>
                `;

                new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(popupContent)
                    .addTo(map);
            };

            map.on('mouseenter', 'hospitals-cluster', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'hospitals-cluster', () => { map.getCanvas().style.cursor = ''; });
            map.on('mouseenter', 'hospitals-point', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'hospitals-point', () => { map.getCanvas().style.cursor = ''; });

            // ---- Spiderfy: 把同一位置重叠的医生点扇开，便于逐一查看 ----
            const SPIDER_RADIUS = 70; // 像素
            let spiderActive = false;

            const clearSpiderfy = () => {
                if (!spiderActive) return;
                spiderActive = false;
                if (map.getLayer('spider-points')) map.removeLayer('spider-points');
                if (map.getLayer('spider-legs')) map.removeLayer('spider-legs');
                if (map.getSource('spider-data')) map.removeSource('spider-data');
            };

            const spiderfyCluster = (clusterId, center) => {
                clearSpiderfy();
                const source = map.getSource('hospitals-data');
                source.getClusterLeaves(clusterId, 100, 0, (err, leaves) => {
                    if (err || !leaves || leaves.length === 0) return;

                    // 判断是否“同位置重叠”：所有叶子坐标彼此几乎一致
                    // 注意：不能拿簇中心(center)作基准，Mapbox 的簇中心可能与叶子坐标有偏差
                    const eps = 1e-4;
                    const ref = leaves[0].geometry.coordinates;
                    const coLocated = leaves.every((leaf) => {
                        const c = leaf.geometry.coordinates;
                        return Math.abs(c[0] - ref[0]) < eps && Math.abs(c[1] - ref[1]) < eps;
                    });

                    if (!coLocated) {
                        // 非重叠簇：保持原有放大行为
                        source.getClusterExpansionZoom(clusterId, (err2, zoom) => {
                            if (err2) return;
                            map.easeTo({ center, zoom });
                        });
                        return;
                    }

                    // 计算扇开位置：围绕叶子实际坐标均匀分布在一个圆上
                    const centerPixel = map.project(ref);
                    const n = leaves.length;
                    const fanned = leaves.map((leaf, i) => {
                        const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
                        const px = centerPixel.x + Math.cos(angle) * SPIDER_RADIUS;
                        const py = centerPixel.y + Math.sin(angle) * SPIDER_RADIUS;
                        const lngLat = map.unproject([px, py]);
                        return { leaf, lngLat };
                    });

                    const features = [];
                    fanned.forEach(({ leaf, lngLat }) => {
                        features.push({
                            type: 'Feature',
                            properties: { ...leaf.properties },
                            geometry: {
                                type: 'LineString',
                                coordinates: [ref, [lngLat.lng, lngLat.lat]]
                            }
                        });
                        features.push({
                            type: 'Feature',
                            properties: { ...leaf.properties },
                            geometry: {
                                type: 'Point',
                                coordinates: [lngLat.lng, lngLat.lat]
                            }
                        });
                    });

                    if (map.getSource('spider-data')) map.removeSource('spider-data');
                    map.addSource('spider-data', {
                        type: 'geojson',
                        data: { type: 'FeatureCollection', features }
                    });

                    if (!map.getLayer('spider-legs')) {
                        map.addLayer({
                            id: 'spider-legs',
                            type: 'line',
                            source: 'spider-data',
                            filter: ['==', ['geometry-type'], 'LineString'],
                            paint: {
                                'line-color': '#00f2ff',
                                'line-width': 1.5,
                                'line-opacity': 0.7
                            }
                        });
                    }
                    if (!map.getLayer('spider-points')) {
                        map.addLayer({
                            id: 'spider-points',
                            type: 'circle',
                            source: 'spider-data',
                            filter: ['==', ['geometry-type'], 'Point'],
                            paint: {
                                'circle-radius': 7,
                                'circle-color': '#00f2ff',
                                'circle-stroke-color': '#ffffff',
                                'circle-stroke-width': 1.5
                            }
                        });
                    }

                    spiderActive = true;
                });
            };

            map.on('click', 'hospitals-cluster', (e) => {
                const features = map.queryRenderedFeatures(e.point, { layers: ['hospitals-cluster'] });
                if (!features.length) return;
                const clusterId = features[0].properties.cluster_id;
                spiderfyCluster(clusterId, features[0].geometry.coordinates);
            });

            map.on('click', 'hospitals-point', showPopup);
            map.on('click', 'spider-points', showPopup);

            // 点击空白处、缩放或移动地图时收起 spiderfy
            map.on('click', (e) => {
                const layers = ['hospitals-cluster', 'hospitals-point'];
                if (map.getLayer('spider-points')) layers.push('spider-points');
                const hit = map.queryRenderedFeatures(e.point, { layers });
                if (hit.length === 0) clearSpiderfy();
            });
            map.on('zoom', clearSpiderfy);
            map.on('move', clearSpiderfy);
        });
    });

    // 4. 按钮切换逻辑 (Filter)
    function updateFilter(type) {
        // 重置按钮 UI 样式
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));

        if (type === 'all') {
            document.getElementById('btn-all').classList.add('active');
        } else if (type === 'initial') {
            document.getElementById('btn-initial').classList.add('active');
        } else if (type === 'guide') {
            document.getElementById('btn-guide').classList.add('active');
        }

        if (!adjustedGeojson) return;

        let filteredFeatures = adjustedGeojson.features;
        if (type === 'initial') {
            filteredFeatures = adjustedGeojson.features.filter(
                (f) => String(f.properties.can_initial || '').trim().toLowerCase() === 'yes'
            );
        } else if (type === 'guide') {
            filteredFeatures = adjustedGeojson.features.filter(
                (f) => String(f.properties.can_guidance || '').trim().toLowerCase() === 'yes'
            );
        }

        // 重建数据源，使聚类与数量随筛选结果自动更新
        map.getSource('hospitals-data').setData({
            ...adjustedGeojson,
            features: filteredFeatures
        });
    }
</script>
</body>
</html>
