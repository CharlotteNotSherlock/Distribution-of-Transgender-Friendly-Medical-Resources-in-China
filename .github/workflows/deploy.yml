name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secret
        run: |
          if [ -z "${{ secrets.MAPBOX_TOKEN }}" ]; then
            echo "MAPBOX_TOKEN secret is not configured."
            exit 1
          fi

      - name: Inject Mapbox token
        run: |
          TOKEN='${{ secrets.MAPBOX_TOKEN }}'
          ESCAPED_TOKEN=$(printf '%s\n' "$TOKEN" | sed -e 's/[\/&]/\\&/g')
          sed -i "s/__MAPBOX_TOKEN__/$ESCAPED_TOKEN/g" index.html
          if grep -q '__MAPBOX_TOKEN__' index.html; then
            echo "Token placeholder was not replaced."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
